
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logos.png" />
    <link rel="apple-touch-icon" href="/logos.png" />
    <meta property="og:image" content="/logos.png" />
    <title>Smart Tourism - Best Travel Agency for India & International Trips</title>
    <meta name="description" content="Discover the smartest way to travel. Smart Tourism offers curated holiday packages, luxury stays, and budget-friendly trips across India and the globe.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e8303a",
              "background-light": "#ffffff",
              "background-dark": "#000000",
              "charcoal": "#111111",
            },
            fontFamily: {
              "sans": ["Plus Jakarta Sans", "sans-serif"],
              "serif": ["Noto Serif", "serif"],
              "noto-sans": ["Noto Sans", "sans-serif"]
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .display-header {
        font-style: italic;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 0.9;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-nav {
        backdrop-filter: blur(12px);
        background-color: rgba(255, 255, 255, 0.9);
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .text-glow {
        text-shadow: 0 0 20px rgba(232, 48, 58, 0.3);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
        }
      }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-charcoal transition-colors duration-300">
    <div id="root"></div>

</html>
